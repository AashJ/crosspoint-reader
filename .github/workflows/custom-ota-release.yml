name: Publish Custom X4 Pro OTA

on:
  push:
    branches:
      - release/aj-rc
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-x4pro-ota-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CUSTOM_VERSION: 1000.0.${{ github.run_number }}
      CUSTOM_TAG: v1000.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set custom firmware version
        run: |
          sed -i -E "0,/^version = /s//version = ${CUSTOM_VERSION}/" platformio.ini
          grep -F "version = ${CUSTOM_VERSION}" platformio.ini

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: custom-x4pro-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: custom-x4pro-pio-${{ runner.os }}-

      - name: Build X4 Pro firmware
        run: pio run -e x4pro-gh_release -j1

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp .pio/build/x4pro-gh_release/firmware.bin dist/firmware-x4pro.bin
          sha256sum dist/firmware-x4pro.bin > dist/firmware-x4pro.bin.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${CUSTOM_TAG}" \
            dist/firmware-x4pro.bin \
            dist/firmware-x4pro.bin.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Custom X4 Pro ${CUSTOM_VERSION}" \
            --latest \
            --notes "Custom X4 Pro OTA build from ${GITHUB_SHA}."
